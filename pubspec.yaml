name: zadana_delivery
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  build_runner: ^2.13.1
  device_preview: ^1.3.1
  image_picker: ^1.2.1
  persistent_bottom_nav_bar_v2: ^6.3.1
  flutter_localizations:
    sdk: flutter
  
dev_dependencies:
  json_serializable: ^6.13.1
  injectable_generator: ^2.12.1
  retrofit_generator: ^10.2.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
