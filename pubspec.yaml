name: zadana_delivery
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any
  json_annotation: ^4.11.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.1
  build_runner: ^2.13.1
  device_preview: ^1.3.1
  image_picker: ^1.2.1
  persistent_bottom_nav_bar_v2: ^6.3.1
  url_launcher: ^6.3.1
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  internet_connection_checker_plus: ^2.9.1+2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  signalr_netcore: ^1.4.4
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  flutter_local_notifications: ^19.4.2
  onesignal_flutter: ^5.5.1
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  
dev_dependencies:
  json_serializable: ^6.13.1
  injectable_generator: ^2.12.1
  retrofit_generator: ^10.2.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animation/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
