workflows:
  ios-ipa:
    name: iOS IPA Build

    integrations:
      app_store_connect: "Zadana Codemagic API Key"

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zadana.delivery

      groups:
        - app_store_connect

      vars:
        BUNDLE_ID: com.zadana.delivery
        DRIVER_ONESIGNAL_APP_ID: 1eead1ea-3d6f-4f2a-8bc5-c681d71b55f6

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate files
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Validate OneSignal App ID
        script: |
          if [ "$DRIVER_ONESIGNAL_APP_ID" != "1eead1ea-3d6f-4f2a-8bc5-c681d71b55f6" ]; then
            echo "Incorrect or missing DRIVER_ONESIGNAL_APP_ID"
            exit 1
          fi

          echo "OneSignal App ID is correct"

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define=DRIVER_ONESIGNAL_APP_ID="$DRIVER_ONESIGNAL_APP_ID" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Verify signed entitlements
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app was not found at: $APP_PATH"
            exit 1
          fi

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "Provisioning profile was not found inside Runner.app"
            exit 1
          fi

          echo "Signed application entitlements:"
          codesign -d --entitlements - "$APP_PATH"

          security cms -D \
            -i "$APP_PATH/embedded.mobileprovision" \
            > /tmp/profile.plist

          echo "APNs environment:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:aps-environment" \
            /tmp/profile.plist

          echo "Application identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            /tmp/profile.plist

          echo "Provisioning profile name:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            /tmp/profile.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration