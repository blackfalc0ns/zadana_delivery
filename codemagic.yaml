workflows:
  ios-ipa:
    name: iOS IPA Build

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign
      - mkdir -p Payload
      - cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
      - zip -r Runner.ipa Payload

    artifacts:
      - Runner.ipa