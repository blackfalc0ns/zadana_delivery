workflows:
  ios-ipa:
    name: iOS IPA Build

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - flutter pub get
      - flutter build ios --release --no-codesign --config-only
      - |
        xcodebuild \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          -archivePath build/ios/archive/Runner.xcarchive \
          archive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""
      - mkdir -p Payload
      - cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/Runner.app
      - zip -r Runner.ipa Payload

    artifacts:
      - Runner.ipa